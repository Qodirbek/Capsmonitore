{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:520px"><h2>Profil</h2>
<p><b>{{ user.email }}</b></p>
<p class="muted">Telegram: {{ user.tg_username and ('@'+user.tg_username) or 'ulanmagan' }}</p>
<button class="btn gold" type="button" onclick="linkTg()">Telegram ulash</button>
<pre id="tgHint" class="muted" style="margin-top:12px"></pre>
</div>
<script>
async function linkTg(){
  const r=await fetch('/profile/tg',{method:'POST'});
  const j=await r.json();
  document.getElementById('tgHint').textContent=j.hint||JSON.stringify(j);
}
</script>
{% endblock %}
